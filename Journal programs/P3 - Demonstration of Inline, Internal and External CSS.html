<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        h2 {
            color: blue;
            text-align: center;
        }
    </style>

    <link rel="stylesheet" href="external.css">
</head>
<body>

    <div class="external">
        <h1 style="color: green; text-align: center;">This is Inline CSS</h1>

        <h2>This is Internal CSS (Styled in Head section)</h2>

        <p>
            This <span style="color: red; font-size: 50px;">paragraph</span> 
            is styled using span.
        </p>

        <p>This division is styled using external CSS.</p>
    </div>

</body>
</html>
