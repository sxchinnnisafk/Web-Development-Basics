<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height & Width Example</title>

    <style>
        div {
            height: 20%;
            width: 50%;
            background-color: blueviolet;
        }
    </style>
</head>
<body>

    <div>
        This div tag has a height of 20% and a width of 50%.
    </div>

</body>
</html>
