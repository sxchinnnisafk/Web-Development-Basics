<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin Example</title>

    <style>
        #box1 {
            width: 200px;
            height: 200px;
            background-color: blueviolet;
            margin: auto;
        }

        #box2 {
            width: 200px;
            height: 200px;
            background-color: blueviolet;
            margin: 50px 100px 50px 100px;
        }
    </style>
</head>
<body>

    <div id="box1">Box 1</div>
    <div id="box2">Box 2</div>

</body>
</html>
