<!DOCTYPE html>
<html>
<head>
<style>
#btn {
    background-color: lightblue;
    border: 1px solid black;
    border-radius: 3px;
}

#btn:hover {
    background-color: lightblue;
}

#text:focus {
    background-color: lightyellow;
}

#btn:active{
    background-color: yellow;
}

a:visited {
    color: red;
}

</style>
</head>

<body>
    <button id="btn">Click Me</button>
    <input type="text" id="text">
    <a href="https://parents.kletech.ac.in/">Parents Portal</a>
</body>
</html>
