<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Example</title>
    <style>
        #box1 {
            width: 200px;
            height: 200px;
            border: 2px solid black; /*Shorthand Border Property */
            border-top-left-radius: 4px; /*Border Radius Property */
            border-bottom-left-radius: 8px;
        }
        #box2 {
            width: 200px;
            height: 200px;
            border: 2px;
            border-style: dashed;
            border-color: brown;
        }
        #box3 {
            width: 200px;
            height: 100px;
            border-left: 2px solid;
            border-bottom: 2px dotted;
            border-top: 2px dashed;
            border-left-color: blue;

        }
    </style>
</head>
<body>
    <div id="box1">Box 1</div><vbr>
    <div id="box2">Box 2</div><br>
    <div id="box3">Box 3</div>
</body>
</html>
