<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Example</title>
    <style>
        #box1 {
            width: 200px;
            height: 200px;
            padding: 50px; /*Shorthand Padding Property */
            background-color: turquoise;
        }
        #box2 {
            width: 200px;
            height: 200px;
            background-color: darkslateblue;
            padding-right: 20px;
            padding-bottom: 30px;
            padding-left: 10px;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div id="box1">Box 1</div><br>
    <div id="box2">Box 2</div>
</body>
</html>
