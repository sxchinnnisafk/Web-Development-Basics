<!DOCTYPE html>
<html>
<head>
   <style>

  .box {
    width: 120px;
    height: 120px;
    background-color: dodgerblue; 
    border: 4px solid #333;
    border-radius: 15px;
    margin: 100px auto;

    animation: rotateBox 3s linear infinite;
  }

  @keyframes rotateBox {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }
</style>
</head>
<body>

  <div class="box"></div>

</body>
</html>
