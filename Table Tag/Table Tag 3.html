<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Tag 3</title>
</head>
<body>
    <table border="1">
        <tr>
            <th style="background-color: blue;">Date/Day</th>
            <th style="background-color: blue;">Time</th>
            <th style="background-color: blue;">Course Name</th>
        </tr>
        <tr>
            <td rowspan="2">02-03-2026 Monday</td>
            <td>09:30 AM - 10:45 AM</td>
            <td>DBMS</td>
        </tr>
        <tr>
            <td>01:30 PM - 02:45 PM</td>
            <td>Data Structures Using C</td>
        </tr>
        <tr>
            <td rowspan="2">03-03-2026 Tuesday</td>
            <td>09:30 AM - 10:45 AM</td>
            <td>Operating System</td>
        </tr>
        <tr>
            <td>01:30 PM - 02:45 PM</td>
            <td>Applied Statistics</td>
        </tr>
    </table>
</body>
</html>
