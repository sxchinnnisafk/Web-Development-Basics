<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table Example</title>
</head>

<body>

    <h1>Table Tag Example</h1>

    <table border="1" cellpadding="10" cellspacing="0">
        <tr>
            <th>Name</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>A</td>
            <td>85</td>
        </tr>

        <tr>
            <td>B</td>
            <td>90</td>
        </tr>

        <tr>
            <td>C</td>
            <td>60</td>
        </tr>
    </table>

</body>
</html>
