<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meter Element Example</title>
</head>

<body>

<p>Battery: <meter value="0.7">70%</meter></p>

<h1>The meter element</h1>

<p>The meter element is used to display a gauge:</p>

<label for="disk_c">Disk usage C:</label>
<meter id="disk_c" value="6" min="0" max="10">6 out of 10</meter>

<br><br>

<label for="disk_d">Disk usage D:</label>
<meter id="disk_d" value="0.4" min="0" max="1">40%</meter>

</body>
</html>
