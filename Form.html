<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
    <fieldset>
        <legend>Personal Information</legend>
        Student Name:
        <input type="text" id="name" name="na1" required><br><br>
        Age:
        <input type="number" id="age" name="a" min="1" max="100" required><br><br>
        Date of Birth:
        <input type="date" id="dob" name="d1" required><br><br>
        Email:
        <input type="email" id="email" name="e1" required><br><br>
        Password:
        <input type="password" id="password" name="p1" required><br><br>
        
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </fieldset></form>
</body>
</html>
