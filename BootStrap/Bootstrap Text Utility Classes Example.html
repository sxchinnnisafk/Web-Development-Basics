<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Class Example</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <h1>Without Bootstrap</h1>
    <h1 class="text-primary">With Bootstrap</h1>
    <h1 class="text-primary">Primary</h1>
    <h1 class="text-secondary">Secondary</h1>
    <h1 class="text-success">Success</h1>
    <h1 class="text-danger">Danger</h1>
    <h1 class="text-warning">Warning</h1>
    <h1 class="text-info">Info</h1> <p class="text-center">Center</p>
    <p class="text-end">Right</p>
    <p class="fw-bold">Bold Text</p>
    <p class="fst-italic">Italic Text</p>
</body>
</html>
