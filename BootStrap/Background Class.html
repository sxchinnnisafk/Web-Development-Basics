<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Class Example</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div>Without Bootstrap</div>
    <div class="bg-primary text-white">With Bootstrap</div>
    <div class="text-bg-success">Success Background</div>
    <div class="text-bg-danger">Danger Background</div> 
    <div class="text-bg-warning">Warning Background</div>
</body>
</html>
