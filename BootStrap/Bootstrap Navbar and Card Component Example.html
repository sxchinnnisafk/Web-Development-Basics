<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Title Example</title>
    <!-- Added Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar Fix: Added container-fluid and ms-auto to push links to the right -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Welcome</a>
            
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="#">Home</a>
                <a class="nav-link" href="#">Register</a>
            </div>
        </div>
    </nav>

    <!-- Card Fix: Added a container and margin for spacing -->
    <div class="container mt-4">
        <div class="card bg-light" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title">Simple Card</h5>
                <p class="card-text">This is a Bootstrap Card.</p>
                <a href="#" class="btn btn-primary">Go somewhere</a>
            </div>
        </div>
    </div>

    <!-- Added Bootstrap 5 JS Bundle (Optional but recommended for components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
