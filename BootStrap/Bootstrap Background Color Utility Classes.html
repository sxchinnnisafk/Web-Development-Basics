<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Background Classes Example</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body class="p-3">

    <div>Without Bootstrap</div>

    <div class="bg-primary text-white p-2 mt-2">
        With Bootstrap
    </div>

    <div class="text-bg-success p-2 mt-2">
        Success Background
    </div>

    <div class="text-bg-danger p-2 mt-2">
        Danger Background
    </div>

    <div class="text-bg-warning p-2 mt-2">
        Warning Background
    </div>

</body>
</html>
